name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 1.0.0)"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: Build Packages & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools & Twine
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel distributions
        run: |
          python -m build

      - name: Check package metadata integrity with Twine
        run: |
          twine check dist/*

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && env.TWINE_PASSWORD != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --skip-existing
