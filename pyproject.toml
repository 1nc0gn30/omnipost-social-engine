[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipost-social-engine"
version = "1.0.0"
description = "Zero-dependency social media copywriting engine, thread splitter, campaign exporter, and Model Context Protocol (MCP) server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Omnipost Contributors" }
]
keywords = [
    "social-media",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "twitter",
    "threads",
    "bluesky",
    "linkedin",
    "copywriting",
    "campaign-exporter",
    "buffer",
    "hootsuite",
    "typefully",
    "zero-dependencies"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
omnipost = "omnipost_social_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
